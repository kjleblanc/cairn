<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:* http://localhost:*; base-uri 'none'; form-action 'none'" />
    <title>Cairn visual lab</title>
    <style>
      /* Lab-only chrome: the mock badge and the scenario panel. The app
         itself brings its own styles through the real renderer entry. */
      #lab-badge {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 9999;
        font: 700 10px/1 "Segoe UI", system-ui, sans-serif;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: #0b1020;
        background: #ffc979;
        border-radius: 6px;
        padding: 5px 10px;
        pointer-events: none;
      }
      #lab-controls {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: rgba(10, 15, 31, .92);
        border: 1px solid rgba(111, 227, 255, .25);
        border-radius: 12px;
        padding: 10px 12px;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .lab-controls-title {
        margin: 0 0 2px;
        font-size: 10px;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: #6fe3ff;
        opacity: .8;
      }
      .lab-controls-button {
        font: 600 12px/1 "Segoe UI", system-ui, sans-serif;
        color: #e8ecf8;
        background: #1a2247;
        border: 1px solid rgba(111, 227, 255, .2);
        border-radius: 8px;
        padding: 7px 12px;
        text-align: left;
        cursor: pointer;
      }
      .lab-controls-button:hover { background: #232d5c; }
      .lab-controls-button.active { border-color: #ffc979; color: #ffc979; }
      .lab-controls-link { display: block; text-decoration: none; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="lab-badge">mock data · visual lab</div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
