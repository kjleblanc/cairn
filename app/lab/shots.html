<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cairn — review shots</title>
<style>
  /* The shots page: where UI tasks put their settled screenshots so the
     owner reviews look-and-feel without opening the app. Content comes from
     shots/manifest.json (generated per task, untracked like design/). */
  :root {
    --ink: #efe9f7; --muted: #a99ec7; --panel: #221a3e; --line: #3a2f63;
    --accent: #9ae6b4; --bg1: #171130; --bg2: #241a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: "Quicksand", ui-rounded, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(900px 520px at 50% -18%, rgb(91 218 255 / 8%), transparent 62%),
      radial-gradient(1000px 560px at 55% 115%, rgb(255 210 122 / 8%), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    padding: 40px 22px 80px;
  }
  main { width: min(1060px, 100%); margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -.01em; }
  .sub { margin: 0 0 34px; color: var(--muted); font-size: .92rem; }
  .entry { margin: 0 0 44px; }
  .entry-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .entry-task {
    font: 700 .72rem ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent); background: rgb(154 230 180 / 10%); border-radius: 999px; padding: 3px 12px;
  }
  .entry-head h2 { margin: 0; font-size: 1.15rem; }
  .entry-cap { margin: 0 0 16px; color: var(--muted); font-size: .9rem; max-width: 70ch; }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  figure {
    margin: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden;
  }
  figure img { display: block; width: 100%; cursor: zoom-in; }
  figcaption { padding: 9px 14px; color: var(--muted); font-size: .78rem; }
  .empty { color: var(--muted); }
  /* Click a shot to look closely; click again (or Esc) to come back. */
  .zoom {
    position: fixed; inset: 0; z-index: 10; display: none; place-items: center;
    background: rgb(10 7 24 / 88%); cursor: zoom-out; padding: 24px;
  }
  .zoom.open { display: grid; }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 30px 90px rgb(0 0 0 / 50%); }
</style>
</head>
<body>
<main>
  <h1>Review shots</h1>
  <p class="sub">Settled screenshots from UI tasks — newest first. Click any shot to look closely.</p>
  <div id="entries"><p class="empty">Loading…</p></div>
</main>
<div class="zoom" id="zoom"><img id="zoom-img" alt="Enlarged screenshot" /></div>
<script>
  const entries = document.getElementById("entries");
  const zoom = document.getElementById("zoom");
  const zoomImg = document.getElementById("zoom-img");

  function openZoom(src, label) {
    zoomImg.src = src;
    zoomImg.alt = label;
    zoom.classList.add("open");
  }
  zoom.addEventListener("click", () => zoom.classList.remove("open"));
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") zoom.classList.remove("open"); });

  fetch("./shots/manifest.json")
    .then((r) => { if (!r.ok) throw new Error("no manifest"); return r.json(); })
    .then((data) => {
      entries.textContent = "";
      if (!data.entries || data.entries.length === 0) {
        entries.innerHTML = '<p class="empty">No shots yet — the next UI task will add the first entry.</p>';
        return;
      }
      for (const entry of data.entries) {
        const section = document.createElement("section");
        section.className = "entry";
        const head = document.createElement("div");
        head.className = "entry-head";
        const tag = document.createElement("span");
        tag.className = "entry-task";
        tag.textContent = entry.task;
        const title = document.createElement("h2");
        title.textContent = entry.title;
        head.append(tag, title);
        const cap = document.createElement("p");
        cap.className = "entry-cap";
        cap.textContent = entry.caption || "";
        const grid = document.createElement("div");
        grid.className = "shots";
        for (const shot of entry.shots) {
          const fig = document.createElement("figure");
          const img = document.createElement("img");
          img.src = "./shots/" + shot.file;
          img.alt = shot.label;
          img.loading = "lazy";
          img.addEventListener("click", () => openZoom(img.src, shot.label));
          const fc = document.createElement("figcaption");
          fc.textContent = shot.label;
          fig.append(img, fc);
          grid.append(fig);
        }
        section.append(head, cap, grid);
        entries.append(section);
      }
    })
    .catch(() => {
      entries.innerHTML = '<p class="empty">No shots yet — the next UI task will add the first entry.</p>';
    });
</script>
</body>
</html>
